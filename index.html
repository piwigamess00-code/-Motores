<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTORS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#171819;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.screen{
  display:none;
  min-height:100vh;
  padding:18px;
}

#home{
  display:flex;
  justify-content:center;
  align-items:center;
}

.home-menu{
  display:grid;
  grid-template-columns:150px 150px;
  gap:20px;
}

.home-btn{
  height:82px;
  border:2px solid #555;
  border-radius:9px;
  background:linear-gradient(145deg,#3b3d3f,#292b2d);
  color:#eee;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 5px 0 #090a0b;
}

.home-btn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #090a0b;
}

.add-btn{
  grid-column:1/3;
  width:150px;
  justify-self:center;
}

/* HEADER */

.header{
  height:48px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:20px;
}

.title{
  font-size:23px;
  font-weight:900;
  letter-spacing:2px;
}

.back{
  position:absolute;
  left:0;
  width:42px;
  height:42px;
  border:2px solid #555;
  border-radius:7px;
  background:#292b2d;
  color:#fff;
  font-size:25px;
}

/* SEARCH */

.search-row{
  display:flex;
  gap:9px;
}

.search-input{
  flex:1;
  height:52px;
  border:2px solid #555;
  border-radius:8px;
  background:#292b2d;
  color:#fff;
  padding:0 13px;
  outline:none;
}

.filter{
  width:52px;
  height:52px;
  border:2px solid #555;
  border-radius:8px;
  background:#292b2d;
  color:#fff;
  font-size:22px;
}

.brands{
  display:none;
  margin-top:10px;
  padding:8px;
  background:#202224;
  border:1px solid #555;
  border-radius:8px;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.brands.open{
  display:grid;
}

.brand{
  min-height:40px;
  border:1px solid #555;
  border-radius:6px;
  background:#2d2f31;
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.brand.selected{
  background:#85898d;
  color:#111;
}

.motor-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px;
}

.motor{
  padding:14px;
  border:1px solid #505255;
  border-left:4px solid #aaa;
  border-radius:7px;
  background:#292b2d;
}

.motor-name{
  font-size:18px;
  font-weight:900;
}

.motor-info{
  color:#aaa;
  font-size:13px;
  margin-top:5px;
}

.motor-price{
  margin-top:8px;
  color:#ddd;
  font-weight:900;
}

.delete-motor{
  width:100%;
  height:40px;
  margin-top:12px;
  border:1px solid #666;
  border-radius:6px;
  background:#202123;
  color:#ddd;
  font-size:12px;
  font-weight:900;
}

.delete-motor:active{
  background:#555;
}

/* TICKET */

.ticket-preview{
  position:absolute;
  right:0;
  top:0;
  width:125px;
  height:40px;
  border:1px solid #555;
  border-radius:6px;
  background:#343638;
  color:#fff;
  font-size:11px;
  font-weight:900;
}

.ticket-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.ticket-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px;
  border:1px solid #555;
  border-radius:7px;
  background:#292b2d;
}

.ticket-name{
  font-weight:900;
}

.ticket-price{
  margin-top:5px;
  color:#ccc;
  font-weight:900;
}

.remove-ticket{
  width:40px;
  height:40px;
  border:1px solid #555;
  border-radius:6px;
  background:#202123;
  color:#ddd;
}

/* ADD */

.form{
  max-width:700px;
  margin:auto;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:11px;
  color:#aaa;
  font-weight:900;
  letter-spacing:1px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  min-height:52px;
  border:2px solid #555;
  border-radius:8px;
  background:#292b2d;
  color:#fff;
  padding:11px;
  outline:none;
}

.field textarea{
  resize:none;
}

.description{
  position:relative;
}

.expand-description{
  position:absolute;
  right:7px;
  bottom:7px;
  width:32px;
  height:32px;
  border:1px solid #666;
  border-radius:5px;
  background:#444;
  color:#fff;
}

.save-item{
  width:100%;
  height:55px;
  margin-top:20px;
  border:2px solid #777;
  border-radius:8px;
  background:#888c90;
  color:#111;
  font-weight:900;
}

/* EMPTY */

.empty{
  min-height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#888;
}

/* DESCRIPTION */

.description-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:#111;
  padding:15px;
  flex-direction:column;
}

.description-overlay.open{
  display:flex;
}

.description-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-weight:900;
}

.close-description{
  width:40px;
  height:40px;
  border:1px solid #555;
  border-radius:6px;
  background:#292b2d;
  color:#fff;
  font-size:22px;
}

.big-description{
  flex:1;
  width:100%;
  resize:none;
  border:2px solid #555;
  border-radius:8px;
  background:#222;
  color:#fff;
  padding:14px;
  outline:none;
}

.done-description{
  height:50px;
  margin-top:10px;
  border:2px solid #777;
  border-radius:7px;
  background:#888;
  color:#111;
  font-weight:900;
}

/* PREVIEW */

.preview{
  display:none;
  position:fixed;
  inset:0;
  z-index:40;
  background:rgba(0,0,0,.8);
  justify-content:center;
  align-items:flex-start;
  padding:60px 15px;
}

.preview.open{
  display:flex;
}

.receipt{
  width:360px;
  max-width:100%;
  max-height:85vh;
  overflow:auto;
  background:#fff;
  color:#111;
  padding:20px;
  font-family:monospace;
}

.receipt h2{
  text-align:center;
  margin-bottom:15px;
}

.receipt-item{
  padding:9px 0;
  border-bottom:1px dashed #777;
}

.receipt-total{
  border-top:2px solid #111;
  margin-top:12px;
  padding-top:10px;
  font-weight:bold;
}

.print-button{
  width:100%;
  height:42px;
  margin-top:15px;
  background:#222;
  color:#fff;
  border:0;
  border-radius:5px;
  font-weight:bold;
}

@media(max-width:500px){

  .home-menu{
    grid-template-columns:135px 135px;
    gap:17px;
  }

  .home-btn{
    width:135px;
    height:76px;
  }

  .add-btn{
    width:135px;
  }

  .form-grid{
    gap:10px;
  }

  .brands.open{
    grid-template-columns:repeat(2,1fr);
  }

  .ticket-preview{
    width:110px;
  }
}

@media print{

  body *{
    visibility:hidden;
  }

  .preview,
  .preview *{
    visibility:visible;
  }

  .preview{
    position:absolute;
    inset:0;
    padding:0;
    background:white;
  }

  .receipt{
    width:100%;
    max-height:none;
  }

  .print-button{
    display:none;
  }
}
</style>
</head>

<body>

<!-- HOME -->

<section id="home" class="screen" style="display:flex">

  <div class="home-menu">

    <button class="home-btn" data-screen="search">
      SEARCH
    </button>

    <button class="home-btn" data-screen="ticket">
      TICKET
    </button>

    <button class="home-btn" data-screen="buy">
      BUY$
    </button>

    <button class="home-btn" data-screen="sales">
      SALES$
    </button>

    <button class="home-btn add-btn" data-screen="add">
      ADD ITEM
    </button>

  </div>

</section>


<!-- SEARCH -->

<section id="search" class="screen">

  <div class="header">

    <button class="back" data-home>
      ←
    </button>

    <div class="title">
      SEARCH
    </div>

  </div>

  <div class="search-row">

    <input
      id="searchInput"
      class="search-input"
      placeholder="Search motors...">

    <button id="filterButton" class="filter">
      ☰
    </button>

  </div>

  <div id="brands" class="brands"></div>

  <div id="searchResults" class="motor-list"></div>

</section>


<!-- TICKET -->

<section id="ticket" class="screen">

  <div class="header">

    <button class="back" data-home>
      ←
    </button>

    <div class="title">
      TICKET
    </div>

    <button id="previewButton" class="ticket-preview">
      TICKET PREVIEW
    </button>

  </div>

  <div id="ticketList" class="ticket-list"></div>

</section>


<!-- BUY -->

<section id="buy" class="screen">

  <div class="header">

    <button class="back" data-home>
      ←
    </button>

    <div class="title">
      BUY$
    </div>

  </div>

  <div class="empty">
    BUY$ MENU — COMING SOON
  </div>

</section>


<!-- SALES -->

<section id="sales" class="screen">

  <div class="header">

    <button class="back" data-home>
      ←
    </button>

    <div class="title">
      SALES$
    </div>

  </div>

  <div class="empty">
    SALES$ MENU — COMING SOON
  </div>

</section>


<!-- ADD ITEM -->

<section id="add" class="screen">

  <div class="header">

    <button class="back" data-home>
      ←
    </button>

    <div class="title">
      ADD ITEM
    </div>

  </div>

  <div class="form">

    <div class="form-grid">

      <div class="field">

        <label>MODEL</label>

        <input id="model" placeholder="Model">

      </div>


      <div class="field">

        <label>YEAR</label>

        <input id="year" type="number" placeholder="Year">

      </div>


      <div class="field">

        <label>MAKE</label>

        <select id="make"></select>

      </div>


      <div class="field description">

        <label>DESCRIPTION</label>

        <textarea
          id="description"
          placeholder="Description..."></textarea>

        <button
          id="expandDescription"
          class="expand-description">
          ↗
        </button>

      </div>


      <div class="field">

        <label>SALE$</label>

        <input
          id="sale"
          type="number"
          step="0.01"
          placeholder="0.00">

      </div>


      <div class="field">

        <label>BUY$</label>

        <input
          id="buy"
          type="number"
          step="0.01"
          placeholder="0.00">

      </div>

    </div>


    <button id="saveItem" class="save-item">
      SAVE ITEM
    </button>

  </div>

</section>


<!-- DESCRIPTION -->

<div id="descriptionOverlay" class="description-overlay">

  <div class="description-top">

    <span>DESCRIPTION</span>

    <button
      id="closeDescription"
      class="close-description">
      ×
    </button>

  </div>

  <textarea
    id="bigDescription"
    class="big-description"
    placeholder="FULL DESCRIPTION..."></textarea>

  <button
    id="doneDescription"
    class="done-description">
    DONE
  </button>

</div>


<!-- PREVIEW -->

<div id="preview" class="preview">

  <div class="receipt">

    <h2>MOTORS</h2>

    <div id="receiptItems"></div>

    <div class="receipt-total">
      TOTAL: $
      <span id="receiptTotal">0.00</span>
    </div>

    <button id="printButton" class="print-button">
      PRINT
    </button>

  </div>

</div>


<script>

/* =====================================================
   SAME BRANDS EVERYWHERE
===================================================== */

const BRANDS = [
  "TOY",
  "FORD",
  "CHEV",
  "BMW",
  "MERC",
  "AUDI",
  "HON",
  "NIS",
  "KIA",
  "HYU",
  "RAM",
  "GMC",
  "DOD",
  "JEEP",
  "TES",
  "LEX",
  "VW",
  "SUB",
  "MAZ",
  "VOL",
  "ACU",
  "INF",
  "CAD",
  "POR",
  "LAM",
  "FER",
  "MAS"
];


/* =====================================================
   LOAD OLD DATA
===================================================== */

let motors = loadArray("motors");

let ticketIds = loadArray("ticketIds");

let selectedBrands = new Set();


function loadArray(key){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(key)
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch{

    return [];

  }
}


/* =====================================================
   SAVE
===================================================== */

function saveAll(){

  localStorage.setItem(
    "motors",
    JSON.stringify(motors)
  );

  localStorage.setItem(
    "ticketIds",
    JSON.stringify(ticketIds)
  );
}


/* =====================================================
   NAVIGATION
===================================================== */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.style.display="none";
    });

  document.getElementById(id).style.display =
    id === "home" ? "flex" : "block";

  if(id === "search"){
    renderSearch();
  }

  if(id === "ticket"){
    renderTicket();
  }
}


document
  .querySelectorAll("[data-screen]")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{
        showScreen(
          button.dataset.screen
        );
      }
    );

  });


document
  .querySelectorAll("[data-home]")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{
        showScreen("home");
      }
    );

  });


/* =====================================================
   BUILD BRANDS
===================================================== */

function buildBrands(){

  const container =
    document.getElementById(
      "brands"
    );

  container.innerHTML =
    BRANDS.map(brand=>`

      <button
        class="brand"
        data-brand="${brand}">

        ${brand}

      </button>

    `).join("");


  container
    .querySelectorAll(".brand")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          const brand =
            button.dataset.brand;


          if(
            selectedBrands.has(brand)
          ){

            selectedBrands.delete(
              brand
            );

          }else{

            selectedBrands.add(
              brand
            );

          }


          button.classList.toggle(
            "selected",
            selectedBrands.has(brand)
          );


          renderSearch();

        }
      );

    });
}


document
  .getElementById("filterButton")
  .addEventListener(
    "click",
    ()=>{

      document
        .getElementById("brands")
        .classList.toggle("open");

    }
  );


/* =====================================================
   MAKE SELECT
===================================================== */

function buildMakes(){

  const select =
    document.getElementById(
      "make"
    );


  select.innerHTML =
    `<option value="">SELECT MAKE...</option>` +

    BRANDS.map(
      brand =>
        `<option value="${brand}">
          ${brand}
        </option>`
    ).join("");
}


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderSearch
  );


function renderSearch(){

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const results =
    motors.filter(motor=>{

      const searchable =
        `${motor.model || ""}
         ${motor.year || ""}
         ${motor.make || ""}
         ${motor.description || ""}`
        .toLowerCase();


      const textOK =
        searchable.includes(query);


      const brandOK =
        selectedBrands.size === 0 ||
        selectedBrands.has(
          motor.make
        );


      return textOK && brandOK;

    });


  const box =
    document.getElementById(
      "searchResults"
    );


  if(results.length === 0){

    box.innerHTML =
      `<div class="empty">
        NO MOTORS FOUND
      </div>`;

    return;
  }


  box.innerHTML =
    results.map(motor=>`

      <div
        class="motor"
        data-id="${motor.id}">

        <div class="motor-name">
          ${safe(motor.model)}
        </div>

        <div class="motor-info">
          ${safe(motor.year)}
          •
          ${safe(motor.make)}
        </div>

        <div class="motor-info">
          ${safe(
            motor.description ||
            "NO DESCRIPTION"
          )}
        </div>

        <div class="motor-price">
          SALE:
          $${Number(
            motor.sale || 0
          ).toFixed(2)}

          &nbsp; | &nbsp;

          BUY:
          $${Number(
            motor.buy || 0
          ).toFixed(2)}
        </div>

        <button
          class="delete-motor"
          data-delete-id="${motor.id}">

          🗑 DELETE MOTOR

        </button>

      </div>

    `).join("");


  /*
    IMPORTANT:
    Buttons are connected AFTER
    the cards are created.
  */

  box
    .querySelectorAll(
      ".delete-motor"
    )
    .forEach(button=>{

      button.addEventListener(
        "click",
        event=>{

          event.preventDefault();
          event.stopPropagation();

          const id =
            button.dataset.deleteId;

          deleteMotor(id);

        }
      );

    });
}


/* =====================================================
   DELETE MOTOR — GLOBAL
===================================================== */

function deleteMotor(rawId){

  /*
    Convert the ID to a string so
    old and new IDs compare correctly.
  */

  const id =
    String(rawId);


  const oldLength =
    motors.length;


  /*
    DELETE FROM MASTER INVENTORY
  */

  motors =
    motors.filter(
      motor =>
        String(motor.id) !== id
    );


  /*
    DELETE FROM TICKET
  */

  ticketIds =
    ticketIds.filter(
      ticketId =>
        String(ticketId) !== id
    );


  /*
    Save immediately.
  */

  saveAll();


  /*
    Refresh EVERYTHING.
  */

  renderSearch();
  renderTicket();
  renderReceipt();


  /*
    If the deleted motor existed,
    show confirmation.
  */

  if(motors.length < oldLength){

    alert(
      "MOTOR DELETED FROM EVERYWHERE"
    );

  }else{

    /*
      This should only happen if
      an old/corrupted ID was clicked.
    */

    console.log(
      "Could not find motor ID:",
      id
    );

  }

}


/* =====================================================
   ADD ITEM
===================================================== */

document
  .getElementById("saveItem")
  .addEventListener(
    "click",
    addMotor
  );


function addMotor(){

  const model =
    document
      .getElementById("model")
      .value
      .trim();


  const year =
    document
      .getElementById("year")
      .value
      .trim();


  const make =
    document
      .getElementById("make")
      .value;


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const sale =
    Number(
      document
        .getElementById("sale")
        .value || 0
    );


  const buy =
    Number(
      document
        .getElementById("buy")
        .value || 0
    );


  if(
    !model ||
    !year ||
    !make
  ){

    alert(
      "MODEL, YEAR AND MAKE ARE REQUIRED."
    );

    return;
  }


  /*
    Guaranteed unique ID.
  */

  const id =
    `${Date.now()}-${Math.random()
      .toString(36)
      .slice(2)}`;


  const motor = {
    id,
    model,
    year,
    make,
    description,
    sale,
    buy
  };


  motors.push(motor);


  /*
    Every new motor automatically
    goes to the ticket.
  */

  ticketIds.push(id);


  saveAll();


  clearForm();


  renderSearch();
  renderTicket();
  renderReceipt();


  alert("ITEM SAVED");

  showScreen("home");
}


function clearForm(){

  [
    "model",
    "year",
    "description",
    "sale",
    "buy"
  ].forEach(id=>{

    document.getElementById(id).value="";

  });


  document.getElementById(
    "make"
  ).value="";
}


/* =====================================================
   TICKET
===================================================== */

function renderTicket(){

  const box =
    document.getElementById(
      "ticketList"
    );


  /*
    Clean any old ticket IDs
    that no longer exist.
  */

  ticketIds =
    ticketIds.filter(
      id =>
        motors.some(
          motor =>
            String(motor.id) ===
            String(id)
        )
    );


  saveAll();


  const items =
    motors.filter(
      motor =>
        ticketIds.some(
