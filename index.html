<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MOTORS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#171819;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.screen{
  display:none;
  min-height:100vh;
  padding:18px;
}

/* HOME */

#home{
  display:flex;
  justify-content:center;
  align-items:center;
}

.home-menu{
  display:grid;
  grid-template-columns:150px 150px;
  gap:20px;
}

.home-btn{
  width:150px;
  height:82px;
  border:2px solid #555;
  border-radius:9px;
  background:linear-gradient(145deg,#3d3f41,#292b2d);
  color:#eee;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 5px 0 #090a0b;
}

.home-btn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #090a0b;
}

.add-btn{
  grid-column:1/3;
  justify-self:center;
}

/* HEADER */

.header{
  height:48px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:20px;
}

.title{
  font-size:23px;
  font-weight:900;
  letter-spacing:2px;
}

.back{
  position:absolute;
  left:0;
  width:42px;
  height:42px;
  border:2px solid #555;
  border-radius:7px;
  background:#292b2d;
  color:#fff;
  font-size:25px;
}

/* SEARCH */

.search-row{
  display:flex;
  gap:9px;
}

.search-input{
  flex:1;
  height:52px;
  border:2px solid #555;
  border-radius:8px;
  background:#292b2d;
  color:#fff;
  padding:0 13px;
  outline:none;
}

.filter{
  width:52px;
  height:52px;
  border:2px solid #555;
  border-radius:8px;
  background:#292b2d;
  color:#fff;
  font-size:22px;
}

.brands{
  display:none;
  margin-top:10px;
  padding:8px;
  background:#202224;
  border:1px solid #555;
  border-radius:8px;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.brands.open{
  display:grid;
}

.brand{
  min-height:40px;
  border:1px solid #555;
  border-radius:6px;
  background:#2d2f31;
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.brand.selected{
  background:#85898d;
  color:#111;
}

.motor-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px;
}

.motor{
  padding:14px;
  border:1px solid #505255;
  border-left:4px solid #aaa;
  border-radius:7px;
  background:#292b2d;
}

.motor-name{
  font-size:18px;
  font-weight:900;
}

.motor-info{
  color:#aaa;
  font-size:13px;
  margin-top:5px;
}

.motor-price{
  margin-top:8px;
  color:#ddd;
  font-weight:900;
}

.delete-motor{

  height:40px;
