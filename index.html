<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#18191a">
<title>MOTORS</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,sans-serif;
}

body{
    background:#18191a;
    color:#eee;
    transition:.2s;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

.page{
    display:none;
    min-height:100vh;
    padding:18px;
}

#home{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   LIGHT MODE
========================= */

body.light{
    background:#eeeeee;
    color:#111;
}

body.light .homeBtn,
body.light .themeBtn,
body.light .back,
body.light .searchInput,
body.light .filterBtn,
body.light .brandPanel,
body.light .brandBtn,
body.light .motorCard,
body.light .ticketCard,
body.light .ticketBrand,
body.light .field input,
body.light .field textarea,
body.light .makeSearchButton,
body.light .makeDropdown,
body.light .makeSearchInput,
body.light .makeOption,
body.light .ticketRemove,
body.light .deleteMotor{
    background:#fff;
    color:#111;
    border-color:#aaa;
}

body.light .motorDescription{
    color:#333;
}

body.light .motorInfo{
    color:#666;
}

body.light .field label{
    color:#666;
}

body.light .selectedMake{
    color:#666;
}

body.light .brandBtn.selected,
body.light .ticketBrand.selected{
    background:#777;
    color:#fff;
}

/* =========================
   HOME
========================= */

.homeTop{
    position:absolute;
    top:15px;
    right:15px;
}

.themeBtn{
    width:45px;
    height:45px;
    border:2px solid #555;
    border-radius:8px;
    background:#292b2d;
    color:#fff;
    font-size:21px;
}

.menu{
    width:310px;
    max-width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.homeBtn{
    height:80px;
    border:2px solid #555;
    border-radius:8px;
    background:#303234;
    color:#fff;
    font-size:14px;
    font-weight:bold;
    box-shadow:0 4px 0 #0d0d0d;
}

.homeBtn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #0d0d0d;
}

.addHome{
    grid-column:1/3;
}

/* =========================
   HEADER
========================= */

.header{
    position:relative;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.title{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

.back{
    position:absolute;
    left:0;
    top:0;
    width:45px;
    height:45px;
    border:2px solid #555;
    border-radius:7px;
    background:#292b2d;
    color:#fff;
    font-size:24px;
}

/* =========================
   SEARCH
========================= */

.searchTop{
    display:flex;
    gap:8px;
}

.searchInput{
    flex:1;
    height:50px;
    padding:10px;
    border:2px solid #555;
    border-radius:7px;
    background:#292b2d;
    color:#fff;
    outline:none;
    font-size:16px;
}

.filterBtn{
    width:50px;
    height:50px;
    border:2px solid #555;
    border-radius:7px;
    background:#292b2d;
    color:#fff;
    font-size:22px;
}

.brandPanel{
    display:none;
    margin-top:10px;
    padding:8px;
    border:1px solid #555;
    border-radius:7px;
    background:#222;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.brandPanel.show{
    display:grid;
}

.brandBtn{
    min-height:43px;
    border:1px solid #555;
    border-radius:6px;
    background:#303234;
    color:#fff;
    font-size:11px;
    font-weight:bold;
}

.brandBtn.selected{
    background:#999;
    color:#111;
}

/* =========================
   MOTOR CARDS
========================= */

.motorList{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.motorCard{
    padding:14px;
    border:1px solid #555;
    border-left:4px solid #aaa;
    border-radius:7px;
    background:#292b2d;
}

.motorTitle{
    font-size:18px;
    font-weight:bold;
}

.motorInfo{
    margin-top:5px;
    color:#aaa;
    font-size:13px;
}

.motorDescription{
    margin-top:9px;
    color:#ccc;
    line-height:1.4;
    white-space:pre-wrap;
}

.motorPrice{
    margin-top:10px;
    font-weight:bold;
}

.deleteMotor{
    width:100%;
    height:42px;
    margin-top:12px;
    border:1px solid #555;
    border-radius:6px;
    background:#202122;
    color:#ddd;
    font-weight:bold;
}

.deleteMotor:active{
    transform:scale(.98);
}

/* =========================
   TICKET
========================= */

.ticketPreviewBtn{
    position:absolute;
    right:0;
    top:2px;
    height:38px;
    padding:0 9px;
    border:1px solid #555;
    border-radius:6px;
    background:#303234;
    color:#fff;
    font-size:9px;
    font-weight:bold;
}

.ticketBrands{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:8px 0 12px;
    scrollbar-width:none;
}

.ticketBrands::-webkit-scrollbar{
    display:none;
}

.ticketBrand{
    flex:0 0 auto;
    min-width:85px;
    height:38px;
    border:1px solid #555;
    border-radius:6px;
    background:#292b2d;
    color:#fff;
    font-size:10px;
    font-weight:bold;
}

.ticketBrand.selected{
    background:#999;
    color:#111;
}

.ticketList{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.ticketCard{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px;
    border:1px solid #555;
    border-radius:7px;
    background:#292b2d;
}

.ticketInfo{
    flex:1;
    min-width:0;
}

.ticketName{
    font-weight:bold;
    font-size:16px;
}

.ticketSub{
    margin-top:4px;
    color:#aaa;
    font-size:12px;
}

.ticketRemove{
    flex:0 0 auto;
    width:40px;
    height:40px;
    border:1px solid #555;
    border-radius:6px;
    background:#202122;
    color:#fff;
    font-size:20px;
}

.ticketAdd{
    flex:0 0 auto;
    width:45px;
    height:40px;
    border:1px solid #555;
    border-radius:6px;
    background:#777;
    color:#fff;
    font-size:18px;
}

.ticketAdd.added{
    background:#444;
    color:#aaa;
}

/* =========================
   ADD ITEM
========================= */

.form{
    width:100%;
    max-width:750px;
    margin:auto;
}

.formGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.field{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label{
    color:#aaa;
    font-size:11px;
    font-weight:bold;
}

.inputWrap{
    position:relative;
}

.inputWrap input,
.inputWrap textarea{
    width:100%;
    padding:20px 11px 8px;
    border:2px solid #555;
    border-radius:7px;
    background:#292b2d;
    color:#fff;
    outline:none;
    font-size:16px;
}

.inputWrap textarea{
    min-height:140px;
    resize:vertical;
    padding-top:22px;
}

.inputWrap input:focus,
.inputWrap textarea:focus{
    border-color:#999;
}

.floatingLabel{
    position:absolute;
    top:8px;
    left:12px;
    pointer-events:none;
    color:#999;
    font-size:11px;
    font-weight:bold;
    transition:.15s;
}

.inputWrap input:not(:placeholder-shown) + .floatingLabel,
.inputWrap textarea:not(:placeholder-shown) + .floatingLabel,
.inputWrap input:focus + .floatingLabel,
.inputWrap textarea:focus + .floatingLabel{
    top:6px;
    font-size:9px;
}

.descriptionField{
    grid-column:1/3;
}

.makeSearchButton{
    width:100%;
    min-height:50px;
    padding:11px;
    border:2px solid #555;
    border-radius:7px;
    background:#292b2d;
    color:#aaa;
    text-align:left;
    font-size:16px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.makeSearchButton.active{
    color:#fff;
}

.selectedMake{
    color:#999;
    font-size:11px;
    min-height:13px;
}

/* =========================
   MAKE DROPDOWN
========================= */

.makeDropdown{
    display:none;
    position:fixed;
    z-index:5000;
    left:18px;
    right:18px;
    top:100px;
    max-height:65vh;
    overflow-y:auto;
    padding:7px;
    border:2px solid #555;
    border-radius:8px;
    background:#202223;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.makeDropdown.show{
    display:block;
}

.makeSearchInput{
    width:100%;
    height:48px;
    margin-bottom:8px;
    padding:10px;
    border:2px solid #555;
    border-radius:7px;
    background:#292b2d;
    color:#fff;
    outline:none;
    font-size:16px;
}

.makeOption{
    width:100%;
    min-height:44px;
    margin-bottom:5px;
    border:1px solid #555;
    border-radius:6px;
    background:#303234;
    color:#fff;
    text-align:left;
    padding:0 11px;
    font-size:14px;
}

.makeOption:last-child{
    margin-bottom:0;
}

/* =========================
   SAVE
========================= */

.saveItem{
    width:100%;
    height:55px;
    margin-top:20px;
    border:2px solid #777;
    border-radius:7px;
    background:#888;
    color:#111;
    font-weight:900;
    font-size:15px;
}

.saveItem:active{
    transform:scale(.98);
}

/* =========================
   EMPTY
========================= */

.empty{
    min-height:60vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    text-align:center;
}

/* =========================
   PREVIEW
========================= */

.preview{
    display:none;
    position:fixed;
    z-index:10000;
    inset:0;
    padding:30px 12px;
    background:rgba(0,0,0,.82);
    align-items:flex-start;
    justify-content:center;
}

.preview.show{
    display:flex;
}

.receipt{
    width:380px;
    max-width:100%;
    max-height:90vh;
    overflow:auto;
    padding:20px;
    background:#fff;
    color:#111;
    font-family:monospace;
}

.receiptTitle{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.receiptItem{
    padding:10px 0;
    border-bottom:1px dashed #777;
}

.receiptTotal{
    margin-top:14px;
    padding-top:10px;
    border-top:2px solid #111;
    font-weight:bold;
}

.printBtn{
    width:100%;
    height:43px;
    margin-top:15px;
    border:0;
    border-radius:5px;
    background:#222;
    color:#fff;
    font-weight:bold;
}

.closePreview{
    width:100%;
    height:43px;
    margin-top:8px;
    border:0;
    border-radius:5px;
    background:#777;
    color:#fff;
    font-weight:bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width:550px){

    .formGrid{
        grid-template-columns:1fr;
    }

    .descriptionField{
        grid-column:auto;
    }

    .header{
        height:55px;
    }

    .ticketPreviewBtn{
        font-size:8px;
        padding:0 7px;
    }
}

@media print{

    body *{
        visibility:hidden;
    }

    .preview,
    .preview *{
        visibility:visible;
    }

    .preview{
        position:absolute;
        inset:0;
        padding:0;
        background:#fff;
    }

    .receipt{
        width:100%;
        max-height:none;
    }

    .printBtn,
    .closePreview{
        display:none;
    }
}
</style>
</head>

<body>

<!-- =========================
     HOME
========================= -->

<div id="home" class="page">

    <div class="homeTop">
        <button id="themeBtn" class="themeBtn" type="button">🌙</button>
    </div>

    <div class="menu">

        <button class="homeBtn" type="button" data-page="search">
            SEARCH
        </button>

        <button class="homeBtn" type="button" data-page="ticket">
            TICKET
        </button>

        <button class="homeBtn" type="button" data-page="buyPage">
            BUY$
        </button>

        <button class="homeBtn" type="button" data-page="sales">
            SALES$
        </button>

        <button class="homeBtn addHome" type="button" data-page="add">
            ADD ITEM
        </button>

    </div>
</div>

<!-- =========================
     SEARCH
========================= -->

<div id="search" class="page">

    <div class="header">

        <button class="back" type="button" data-home>
            ←
        </button>

        <div class="title">
            SEARCH
        </div>

    </div>

    <div class="searchTop">

        <input
            id="searchInput"
            class="searchInput"
            type="search"
            placeholder="Search all motors..."
            autocomplete="off"
        >

        <button id="filterBtn" class="filterBtn" type="button">
            ☰
        </button>

    </div>

    <div id="brandPanel" class="brandPanel"></div>

    <div id="searchResults" class="motorList"></div>

</div>

<!-- =========================
     TICKET
========================= -->

<div id="ticket" class="page">

    <div class="header">

        <button class="back" type="button" data-home>
            ←
        </button>

        <div class="title">
            TICKET
        </div>

        <button
            id="ticketPreviewBtn"
            class="ticketPreviewBtn"
            type="button">
            TICKET PREVIEW
        </button>

    </div>

    <div id="ticketBrands" class="ticketBrands"></div>

    <div id="ticketList" class="ticketList"></div>

</div>

<!-- =========================
     BUY
========================= -->

<div id="buyPage" class="page">

    <div class="header">

        <button class="back" type="button" data-home>
            ←
        </button>

        <div class="title">
            BUY$
        </div>

    </div>

    <div class="empty">
        BUY$ MENU
    </div>

</div>

<!-- =========================
     SALES
========================= -->

<div id="sales" class="page">

    <div class="header">

        <button class="back" type="button" data-home>
            ←
        </button>

        <div class="title">
            SALES$
        </div>

    </div>

    <div class="empty">
        SALES$ MENU
    </div>

</div>

<!-- =========================
     ADD ITEM
========================= -->

<div id="add" class="page">

    <div class="header">

        <button class="back" type="button" data-home>

        </button>

    <div class="form">

        <div class="formGrid">

            <div class="field descriptionField">

                <div class="inputWrap">

<!-- =========================
     MAKE MENU
========================= -->

<div id="makeDropdown" class="makeDropdown">

    <input
        id="makeSearchInput"
        class="makeSearchInput"
        type="search"
        placeholder="Search make..."
        autocomplete="off"
    >

    <div id="makeOptions"></div>

<!-- =========================
     PREVIEW
========================= -->

<div id="preview" class="preview">

    <div class="receipt">

        <div class="receiptTitle">
            MOTORS
        </div>

        <div id="receiptItems"></div>

        <div class="receiptTotal">
            TOTAL: $
            <span id="receiptTotal">0.00</span>
        </div>

            PRINT
        </button>

        <button id="closePreview" class="closePreview" type="button">
            CLOSE
        </button>

    </div>

</div>

<script>
  /* =========================
   BRANDS
========================= */

const BRANDS = [
    ["Toyota","TOY"],
    ["Ford","FORD"],
    ["Chevrolet","CHEV"],
    ["BMW","BMW"],
    ["Mercedes-Benz","MERC"],
    ["Audi","AUDI"],
    ["Honda","HON"],
    ["Nissan","NIS"],
    ["Kia","KIA"],
    ["Hyundai","HYUN"],
    ["Ram","RAM"],
    ["GMC","GMC"],
    ["Dodge","DOD"],
    ["Jeep","JEEP"],
    ["Tesla","TES"],
    ["Lexus","LEX"],
    ["Volkswagen","VW"],
    ["Subaru","SUB"],
    ["Mazda","MAZ"],
    ["Volvo","VOL"],
    ["Acura","ACU"],
    ["Infiniti","INF"],
    ["Cadillac","CAD"],
    ["Porsche","POR"],
    ["Lamborghini","LAM"],
    ["Ferrari","FER"],
    ["Maserati","MAS"]
];


/* =========================
   DATA
========================= */

let motors = readArray("motors");
let ticket = readArray("ticket");

let selectedBrands = [];
let ticketBrandsSelected = [];
let selectedMake = "";


/* =========================
   STORAGE
========================= */

function readArray(key){

    try{

        const value = localStorage.getItem(key);

        if(!value){
            return [];
        }

        const parsed = JSON.parse(value);

        return Array.isArray(parsed) ? parsed : [];

    }catch(error){

        return [];

    }
}


function saveAll(){

    localStorage.setItem(
        "motors",
        JSON.stringify(motors)
    );

    localStorage.setItem(
        "ticket",
        JSON.stringify(ticket)
    );
}


/* =========================
   HELPERS
========================= */

function safe(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function normalizeMake(make){

    const found = BRANDS.find(
        brand =>
            brand[0].toLowerCase() === String(make).toLowerCase() ||
            brand[1].toLowerCase() === String(make).toLowerCase()
    );

    return found ? found[0] : String(make || "");
}


function getMotorId(motor){

    if(!motor.id){
        motor.id =
            Date.now().toString(36) +
            Math.random().toString(36).slice(2);
    }

    return String(motor.id);
}


function makeKey(make){

    return normalizeMake(make).toLowerCase();
}


/* =========================
   NAVIGATION
========================= */

function openPage(name){

    document
        .querySelectorAll(".page")
        .forEach(page=>{
            page.style.display="none";
        });

    const page = document.getElementById(name);

    if(!page){
        return;
    }

    if(name === "home"){
        page.style.display="flex";
    }else{
        page.style.display="block";
    }

    closeMakeMenu();

    if(name === "search"){
        renderBrands();
        renderSearch();
    }

    if(name === "ticket"){
        renderTicketBrands();
        renderTicket();
    }

    if(name === "add"){
        setTimeout(()=>{
            document.getElementById("model")?.focus();
            document.getElementById("model")?.blur();
        },50);
    }
}


/* =========================
   HOME BUTTONS
========================= */

document.addEventListener("click",function(e){

    const button =
        e.target.closest(".homeBtn");

    if(!button){
        return;
    }

    const page =
        button.getAttribute("data-page");

    openPage(page);
});


/* =========================
   BACK BUTTONS
========================= */

document.addEventListener("click",function(e){

    const button =
        e.target.closest("[data-home]");

    if(!button){
        return;
    }

    e.preventDefault();

    closeMakeMenu();

    openPage("home");
});


/* =========================
   THEME
========================= */

function loadTheme(){

    const light =
        localStorage.getItem("theme") === "light";

    document.body.classList.toggle(
        "light",
        light
    );

    const themeBtn =
        document.getElementById("themeBtn");

    if(themeBtn){
        themeBtn.textContent =
            light ? "☀️" : "🌙";
    }
}


document.getElementById("themeBtn")
.addEventListener("click",function(e){

    e.preventDefault();
    e.stopPropagation();

    const light =
        !document.body.classList.contains("light");

    document.body.classList.toggle(
        "light",
        light
    );

    localStorage.setItem(
        "theme",
        light ? "light" : "dark"
    );

    this.textContent =
        light ? "☀️" : "🌙";
});


/* =========================
   SEARCH FILTER
========================= */

document.getElementById("filterBtn")
.addEventListener("click",function(e){

    e.preventDefault();
    e.stopPropagation();

    const panel =
        document.getElementById("brandPanel");

    panel.classList.toggle("show");

    renderBrands();
});


function renderBrands(){

    const panel =
        document.getElementById("brandPanel");

    if(!panel){
        return;
    }

    panel.innerHTML =
        BRANDS.map(brand=>{

            const name = brand[0];

            const selected =
                selectedBrands.includes(name);

            return `
                <button
                    type="button"
                    class="brandBtn ${selected ? "selected" : ""}"
                    data-brand="${safe(name)}">
                    ${safe(name)}
                </button>
            `;

        }).join("");
}


document.addEventListener("click",function(e){

    const button =
        e.target.closest(".brandBtn");

    if(!button){
        return;
    }

    e.preventDefault();
    e.stopPropagation();

    const name =
        button.getAttribute("data-brand");

    const index =
        selectedBrands.indexOf(name);

    if(index === -1){
        selectedBrands.push(name);
    }else{
        selectedBrands.splice(index,1);
    }

    renderBrands();
    renderSearch();
});


document.getElementById("searchInput")
.addEventListener("input",renderSearch);


function renderSearch(){

    const input =
        document.getElementById("searchInput");

    const box =
        document.getElementById("searchResults");

    if(!input || !box){
        return;
    }

    const query =
        input.value.toLowerCase().trim();

    const results =
        motors.filter(motor=>{

            const make =
                normalizeMake(motor.make);

            const text =
                (
                    motor.model +
                    " " +
                    motor.year +
                    " " +
                    make +
                    " " +
                    motor.description
                ).toLowerCase();

            const searchOK =
                text.includes(query);

            const brandOK =
                selectedBrands.length === 0 ||
                selectedBrands.includes(make);

            return searchOK && brandOK;
        });


    if(!results.length){

        box.innerHTML =
            `<div class="empty">NO MOTORS FOUND</div>`;

        return;
    }


    box.innerHTML =
        results.map(motor=>{

            const id =
                getMotorId(motor);

            return `
                <div class="motorCard">

                    <div class="motorTitle">
                        ${safe(motor.model)}
                    </div>

                    <div class="motorInfo">
                        ${safe(motor.year)}
                        •
                        ${safe(normalizeMake(motor.make))}
                    </div>

                    ${
                        motor.description
                        ?
                        `<div class="motorDescription">
                            ${safe(motor.description)}
                        </div>`
                        :
                        ""
                    }

                    <div class="motorPrice">
                        SALE: $${Number(motor.sale || 0).toFixed(2)}
                        &nbsp; | &nbsp;
                        BUY: $${Number(motor.buy || 0).toFixed(2)}
                    </div>

                    <button
                        type="button"
                        class="deleteMotor"
                        data-delete-id="${safe(id)}">
                        DELETE
                    </button>

                </div>
            `;

        }).join("");

    saveAll();
}


/* =========================
   DELETE MOTOR
========================= */

document.addEventListener("click",function(e){

    const button =
        e.target.closest(".deleteMotor");

    if(!button){
        return;
    }

    e.preventDefault();
    e.stopPropagation();

    const id =
        String(button.getAttribute("data-delete-id"));

    motors =
        motors.filter(
            motor => String(motor.id) !== id
        );

    ticket =
        ticket.filter(
            ticketId => String(ticketId) !== id
        );

    saveAll();

    renderSearch();
    renderTicketBrands();
    renderTicket();
});
  /* =========================

========================= */

function renderMakeOptions(){

    const box =
        document.getElementById("makeOptions");

    if(!input || !box){

    }

    const query =
        input.value.toLowerCase().trim();

function openMakeMenu(){

    const dropdown =
        document.getElementById("makeDropdown");

    const input =
        document.getElementById("makeSearchInput");

    if(!dropdown){
        return;
    }

    dropdown.classList.add("show");

    renderMakeOptions();

    setTimeout(()=>{
        input?.focus();
    },100);

function closeMakeMenu(){

        document.getElementById("makeDropdown");

document.getElementById("makeOpen")
.addEventListener("click",function(e){

    e.stopPropagation();

});


document.getElementById("makeSearchInput")
.addEventListener("input",renderMakeOptions);

    if(!option){
        return;
    }

    e.stopPropagation();

/* =========================
   CLOSE MAKE MENU
========================= */

document.addEventListener("click",function(e){

    const dropdown =
        document.getElementById("makeDropdown");

    const makeButton =
        document.getElementById("makeOpen");

    if(!dropdown){
        return;
    }

    ){

/* =========================
   SAVE ITEM
========================= */

document.getElementById("saveItem")
.addEventListener("click",function(e){

    e.preventDefault();
    e.stopPropagation();

    const model =
        document.getElementById("model").value.trim();

    const year =
        document.getElementById("year").value.trim();

    const sale =
        document.getElementById("salePrice").value.trim();

    const buy =
        document.getElementById("buyPrice").value.trim();

    const description =
        document.getElementById("description").value.trim();


    if(!model){

        alert("Enter a model.");

        document.getElementById("model").focus();

        return;
    }


    if(!year){

        alert("Enter a year.");

        document.getElementById("year").focus();

        return;
    }


    if(!selectedMake){

        alert("Select a make.");

        openMakeMenu();

        return;
    }


    const motor = {

        id:
            Date.now().toString(36) +
            Math.random().toString(36).slice(2),

        model:model,

        year:year,

        make:selectedMake,

        sale:
            Number(sale || 0),

        buy:
            Number(buy || 0),

        description:description
    };


    motors.push(motor);

    saveAll();


    /* CLEAR FORM */

    document.getElementById("model").value = "";
    document.getElementById("year").value = "";
    document.getElementById("salePrice").value = "";
    document.getElementById("buyPrice").value = "";
    document.getElementById("description").value = "";

    selectedMake = "";

    document.getElementById("makeOpen").textContent =
        "Select make...";

    document.getElementById("makeOpen")
        .classList.remove("active");

    document.getElementById("selectedMake")
        .textContent =
        "No make selected";

    closeMakeMenu();

    /* Go back to search without popup */

    openPage("search");
});


/* =========================
   TICKET BRANDS
========================= */

function getInventoryBrands(){

    const unique = [];

    motors.forEach(motor=>{

        const make =
            normalizeMake(motor.make);

        if(
            make &&
            !unique.includes(make)
        ){
            unique.push(make);
        }

    });

    return unique.sort();
}


function renderTicketBrands(){

    const box =
        document.getElementById("ticketBrands");

    if(!box){
        return;
    }

    const available =
        getInventoryBrands();


    /* Remove selected brands that no longer exist */

    ticketBrandsSelected =
        ticketBrandsSelected.filter(
            brand => available.includes(brand)
        );


    if(!available.length){

        box.innerHTML = "";

        return;
    }


    box.innerHTML =
        available.map(make=>{

            const selected =
                ticketBrandsSelected.includes(make);

            return `
                <button
                    type="button"
                    class="ticketBrand ${selected ? "selected" : ""}"
                    data-ticket-brand="${safe(make)}">
                    ${safe(make)}
                </button>
            `;

        }).join("");
}


document.addEventListener("click",function(e){

    const button =
        e.target.closest(".ticketBrand");

    if(!button){
        return;
    }

    e.preventDefault();
    e.stopPropagation();

    const make =
        button.getAttribute("data-ticket-brand");

    const index =
        ticketBrandsSelected.indexOf(make);

    if(index === -1){

        ticketBrandsSelected.push(make);

    }else{

        ticketBrandsSelected.splice(index,1);

    }

    renderTicketBrands();
    renderTicket();
});


/* =========================
   TICKET LIST
========================= */

function renderTicket(){

    const box =
        document.getElementById("ticketList");

    if(!box){
        return;
    }


    const available =
        getInventoryBrands();


    if(!motors.length){

        box.innerHTML =
            `<div class="empty">
                NO MOTORS IN INVENTORY
            </div>`;

        return;
    }


    let results =
        motors.filter(motor=>{

            const make =
                normalizeMake(motor.make);

            if(
                ticketBrandsSelected.length &&
                !ticketBrandsSelected.includes(make)
            ){
                return false;
            }

            return true;
        });


    if(!results.length){

        box.innerHTML =
            `<div class="empty">
                NO MOTORS FOR THIS BRAND
            </div>`;

        return;
    }


    box.innerHTML =
        results.map(motor=>{

            const id =
                getMotorId(motor);

            const added =
                ticket.some(
                    ticketId =>
                    String(ticketId) === String(id)
                );

            return `
                <div class="ticketCard">

                    <div class="ticketInfo">

                        <div class="ticketName">
                            ${safe(motor.model)}
                        </div>

                        <div class="ticketSub">
                            ${safe(normalizeMake(motor.make))}
                            •
                            ${safe(motor.year)}
                            •
                            $${Number(motor.sale || 0).toFixed(2)}
                        </div>

                    </div>

                    <button
                        type="button"
                        class="ticketAdd ${added ? "added" : ""}"
                        data-ticket-add="${safe(id)}">
                        ${added ? "✓" : "+"}
                    </button>

                </div>
            `;

        }).join("");

    saveAll();
}


/* =========================
   ADD / REMOVE TICKET
========================= */

document.addEventListener("click",function(e){

    const button =
        e.target.closest(".ticketAdd");

    if(!button){
        return;
    }

    e.preventDefault();
    e.stopPropagation();

    const id =
        String(
            button.getAttribute("data-ticket-add")
        );


    const index =
        ticket.findIndex(
            ticketId =>
            String(ticketId) === id
        );


    if(index === -1){

        ticket.push(id);

    }else{

        ticket.splice(index,1);

    }


    saveAll();

    renderTicket();
});


/* =========================
   REMOVE FROM TICKET
========================= */

document.addEventListener("click",function(e){

    const button =
        e.target.closest(".ticketRemove");

    if(!button){
        return;
    }

    e.preventDefault();
    e.stopPropagation();

    const id =
        String(
            button.getAttribute("data-ticket-remove")
        );

    ticket =
        ticket.filter(
            ticketId =>
            String(ticketId) !== id
        );

    saveAll();

    renderTicket();
})
  /* =========================
   TICKET PREVIEW
========================= */

document.getElementById("ticketPreviewBtn")
.addEventListener("click",function(e){

    e.preventDefault();
    e.stopPropagation();

    const selectedMotors =
        motors.filter(motor=>{

            const id =
                getMotorId(motor);

            return ticket.some(
                ticketId =>
                String(ticketId) === String(id)
            );

        });


    const items =
        document.getElementById("receiptItems");

    const totalElement =
        document.getElementById("receiptTotal");


    if(!selectedMotors.length){

        items.innerHTML = `
            <div class="receiptItem">
                No items in ticket.
            </div>
        `;

        totalElement.textContent =
            "0.00";

    }else{

        let total = 0;


        items.innerHTML =
            selectedMotors.map(motor=>{

                const price =
                    Number(motor.sale || 0);

                total += price;


                return `
                    <div class="receiptItem">

                        ${safe(normalizeMake(motor.make))}
                        ${safe(motor.model)}

                        <br>

                        ${safe(motor.year)}

                        <br>

                        $${price.toFixed(2)}

                    </div>
                `;

            }).join("");


        totalElement.textContent =
            total.toFixed(2);
    }


    document
        .getElementById("preview")
        .classList.add("show");
});


/* =========================
   CLOSE PREVIEW
========================= */

document.getElementById("preview")
.addEventListener("click",function(e){

    if(e.target === this){

        this.classList.remove("show");

    }
});


document.getElementById("closePreview")
.addEventListener("click",function(e){

    e.preventDefault();
    e.stopPropagation();

    document
        .getElementById("preview")
        .classList.remove("show");
});

========================= */

document.getElementById("printBtn")
.addEventListener("click",function(e){

    e.preventDefault();
    e.stopPropagation();

    window.print();
});


/* =========================
   MOBILE ENTER FIX
========================= */

document.addEventListener("keydown",function(e){

    if(e.key !== "Enter"){
        return;
    }


    const target =
        e.target;


    /*
       Description keeps Enter.
       Make search keeps Enter.
    */

    if(
        target.id === "description" ||
        target.id === "makeSearchInput"
    ){
        return;
    }


    /*
       For normal inputs, hide keyboard
       when Enter is pressed.
    */

    if(
        target.tagName === "INPUT" &&
        target.type !== "search"
    ){

        e.preventDefault();

        target.blur();

    }

});

   PREVENT FORM-LIKE SUBMITS
========================= */

document.addEventListener("submit",function(e){

    e.preventDefault();

});

motors.forEach(motor=>{

ticket =

        return motors.some(
            motor =>

        );

loadTheme();
